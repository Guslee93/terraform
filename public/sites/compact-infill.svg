<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="compact-title compact-desc">
  <title id="compact-title">Compact Infill site thumbnail</title>
  <desc id="compact-desc">A plan diagram of a dense Oslo block with a marked infill parcel and two conceptual building footprints.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#202521" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#202521" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="#E8EBE7"/>
  <rect width="640" height="400" fill="url(#grid)"/>

  <g stroke="#F5F5F1" stroke-width="20" stroke-linecap="square">
    <path d="M0 118H640"/>
    <path d="M0 300H640"/>
    <path d="M158 0V400"/>
    <path d="M444 0V400"/>
  </g>

  <g fill="#C7CEC3" stroke="#AEB7AA" stroke-width="1" filter="url(#soft)">
    <rect x="20" y="16" width="118" height="82" rx="1"/>
    <rect x="180" y="16" width="244" height="82" rx="1"/>
    <rect x="466" y="16" width="154" height="82" rx="1"/>
    <rect x="20" y="138" width="118" height="142" rx="1"/>
    <rect x="180" y="138" width="98" height="142" rx="1"/>
    <rect x="466" y="138" width="154" height="142" rx="1"/>
    <rect x="20" y="320" width="118" height="66" rx="1"/>
    <rect x="180" y="320" width="244" height="66" rx="1"/>
    <rect x="466" y="320" width="154" height="66" rx="1"/>
  </g>

  <g fill="#B5BDB1" opacity="0.55">
    <rect x="34" y="30" width="26" height="18"/>
    <rect x="72" y="30" width="26" height="18"/>
    <rect x="196" y="30" width="40" height="18"/>
    <rect x="250" y="30" width="40" height="18"/>
    <rect x="482" y="30" width="30" height="18"/>
  </g>

  <g>
    <polygon points="306,152 430,150 442,282 318,288" fill="#E1EBF0" fill-opacity="0.9" stroke="#2E5670" stroke-width="2.5" stroke-dasharray="8 5"/>
    <rect x="330" y="186" width="84" height="62" fill="#FBF8F0" stroke="#2E5670" stroke-width="2"/>
    <rect x="352" y="201" width="42" height="30" fill="#DCE6EC" stroke="#2E5670" stroke-width="1.5"/>
    <path d="M330 186v-52M330 186l84 62" stroke="#2E5670" stroke-width="1" stroke-dasharray="3 4" opacity="0.75"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#202521">
    <text x="24" y="360" font-size="10" letter-spacing="2.2" fill-opacity="0.55">COMPACT INFILL</text>
    <text x="24" y="377" font-size="9" letter-spacing="1.4" fill-opacity="0.4">CURATED DEMO · OSLO BLOCK</text>
  </g>

  <g transform="translate(594 342)">
    <circle r="22" fill="#F5F5F1" fill-opacity="0.8" stroke="#202521" stroke-opacity="0.12"/>
    <path d="M0 9V-9M0-9-4-3M0-9 4-3" stroke="#202521" stroke-width="1.2" fill="none"/>
    <text y="-12" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" letter-spacing="1.2" fill="#202521" fill-opacity="0.65">N</text>
  </g>
</svg>
