<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="slope-title slope-desc">
  <title id="slope-title">Sloped Edge site thumbnail</title>
  <desc id="slope-desc">A plan diagram of an Oslo edge site with contour lines, sparse context buildings and a stepped conceptual massing.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#202521" stroke-opacity="0.045"/>
    </pattern>
    <linearGradient id="terrain" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E8EBE7"/>
      <stop offset="0.55" stop-color="#DFE4DB"/>
      <stop offset="1" stop-color="#D2DACF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#202521" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#terrain)"/>
  <rect width="640" height="400" fill="url(#grid)"/>

  <g fill="none" stroke="#69716C" stroke-opacity="0.26" stroke-width="1.1">
    <path d="M-20 92c90-26 156-18 226 12s142 34 226 4 138-30 228 0"/>
    <path d="M-20 126c92-26 158-16 228 14s144 32 228 2 136-26 226 4"/>
    <path d="M-20 160c90-24 160-12 230 18s142 30 226 0 138-24 228 6"/>
    <path d="M-20 194c88-22 158-10 228 20s146 28 230-2 136-22 226 8"/>
    <path d="M-20 228c90-20 158-8 228 22s146 26 230-4 136-20 226 10"/>
    <path d="M-20 262c88-18 160-6 230 24s144 24 228-6 138-18 228 12"/>
    <path d="M-20 296c90-16 158-4 228 26s146 22 230-8 136-16 226 14"/>
    <path d="M-20 330c88-14 160-2 230 28s144 20 228-10 138-14 228 16"/>
    <path d="M-20 364c90-12 158 0 228 30s146 18 230-12 136-12 226 18"/>
  </g>

  <g fill="#D0D5CB" stroke="#BBC1B7" stroke-width="1" filter="url(#soft)">
    <rect x="34" y="34" width="84" height="54" rx="1"/>
    <rect x="132" y="42" width="62" height="46" rx="1"/>
    <rect x="500" y="28" width="106" height="72" rx="1"/>
    <rect x="34" y="300" width="94" height="70" rx="1"/>
  </g>

  <g>
    <polygon points="244,106 448,118 470,266 258,252" fill="#F4F1E9" fill-opacity="0.55" stroke="#355E79" stroke-width="2" stroke-dasharray="8 5"/>
    <rect x="288" y="156" width="104" height="66" fill="#F4F1E9" stroke="#355E79" stroke-width="1.6"/>
    <rect x="306" y="138" width="76" height="48" fill="#EDE9DE" stroke="#355E79" stroke-width="1.3"/>
    <rect x="322" y="122" width="48" height="34" fill="#E9EDF0" stroke="#355E79" stroke-width="1.1"/>
    <path d="M288 156v-52M288 156l104 66" stroke="#355E79" stroke-width="1" stroke-dasharray="3 4" opacity="0.65"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#202521">
    <text x="24" y="360" font-size="10" letter-spacing="2.2" fill-opacity="0.55">SLOPED EDGE</text>
    <text x="24" y="377" font-size="9" letter-spacing="1.4" fill-opacity="0.4">CURATED DEMO · OSLO EDGE</text>
  </g>

  <g transform="translate(594 342)">
    <circle r="22" fill="#F5F5F1" fill-opacity="0.8" stroke="#202521" stroke-opacity="0.12"/>
    <path d="M0 9V-9M0-9-4-3M0-9 4-3" stroke="#202521" stroke-width="1.2" fill="none"/>
    <text y="-12" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" letter-spacing="1.2" fill="#202521" fill-opacity="0.65">N</text>
  </g>
</svg>
